<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Consultar CEP</title>
    <style>
    body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: #f4f6f8;
        color: #222;
        margin: 0;
        padding: 30px;
    }

    h1 {
        color: #2c3e50;
        border-bottom: 3px solid #3498db;
        padding-bottom: 10px;
    }

    a {
        color: #3498db;
        text-decoration: none;
        font-weight: bold;
    }

    a:hover {
        text-decoration: underline;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
        background-color: #fff;
        box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    th, td {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid #ddd;
    }

    th {
        background-color: #2c3e50;
        color: #fff;
    }

    tr:hover {
        background-color: #f1f1f1;
    }

    form {
        background-color: #fff;
        padding: 20px;
        border-radius: 6px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        max-width: 500px;
        margin-top: 20px;
    }

    input[type="text"] {
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        margin-right: 8px;
        box-sizing: border-box;
    }

    button {
        background-color: #3498db;
        color: #fff;
        border: none;
        padding: 10px 20px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 15px;
    }

    button:hover {
        background-color: #2980b9;
    }
    </style>
</head>
<body>
    <h1>Consultar Endereço por CEP</h1>

    <form method="post">
        {% csrf_token %}
        <input type="text" name="cep" placeholder="Ex: 01310100" maxlength="9" required>
        <button type="submit">Buscar</button>
    </form>

    {% if erro %}
        <p style="color: red;">{{ erro }}</p>
    {% endif %}

    {% if resultado %}
        <table border="1" cellpadding="8">
            <tr><th>Logradouro</th><td>{{ resultado.logradouro }}</td></tr>
            <tr><th>Bairro</th><td>{{ resultado.bairro }}</td></tr>
            <tr><th>Cidade</th><td>{{ resultado.localidade }}</td></tr>
            <tr><th>Estado</th><td>{{ resultado.uf }}</td></tr>
            <tr><th>CEP</th><td>{{ resultado.cep }}</td></tr>
        </table>
    {% endif %}

    <br>
    <a href="{% url 'lista_produtos' %}">Voltar</a>
</body>
</html>
